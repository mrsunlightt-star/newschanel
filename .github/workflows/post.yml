name: post-news

on:
  schedule:
    # 每小时第 7/37 分运行——官方文档明确：整点是调度高峰，负载过高时排队任务会被
    # 直接丢弃（不重试）；原 */30 恰好全撞高峰，上线以来一次都没被调度过
    - cron: "7,37 * * * *"
  workflow_dispatch: {}

# 允许 workflow 用 GITHUB_TOKEN 把 data/news.db 提交回仓库
permissions:
  contents: write

concurrency:
  group: post-news
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # 晚高峰 LLM 限流时单条摘要可能退避数分钟，5 条最坏约 18 分钟；
    # 上限须留足余量避免运行被腰斩——被杀的运行无法回存 news.db，会导致已发帖子重复
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          RSS_FEEDS: ${{ vars.RSS_FEEDS }}
        run: python -m bot.main

      - name: Commit database back
        run: |
          git config user.name "newschanel-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.db
          if git diff --cached --quiet; then
            echo "数据库无变化，跳过提交"
          else
            git commit -m "chore: update news.db [skip ci]"
            git push
          fi
